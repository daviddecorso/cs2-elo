[project]
name = "cs2demos"
version = "0.1.0"
description = "CS2 demo pipeline: HLTV demos to validated Parquet in R2"
requires-python = ">=3.12"
dependencies = [
    "awpy==3.1.1",
    "boto3>=1.43.118",
    "demoparser2==0.42.0",
    "playwright>=1.64.1",
    "polars==2.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
cs2demos = "cs2demos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
