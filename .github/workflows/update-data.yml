name: Update data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *" # Daily off-hour run

permissions:
  contents: write

concurrency: update-data

jobs:
  update:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out submodule with full history
        run: |
          git submodule update --init vendor/counter-strike_regional_standings
          if [ "$(git -C vendor/counter-strike_regional_standings rev-parse --is-shallow-repository)" = "true" ]; then
            git -C vendor/counter-strike_regional_standings fetch --unshallow
          fi
      - name: Update submodule and check for model changes
        run: |
          OLD_COMMIT=$(git -C vendor/counter-strike_regional_standings rev-parse HEAD)
          git submodule update --remote vendor/counter-strike_regional_standings
          NEW_COMMIT=$(git -C vendor/counter-strike_regional_standings rev-parse HEAD)
          if [ "$OLD_COMMIT" != "$NEW_COMMIT" ]; then
            if ! git -C vendor/counter-strike_regional_standings diff --quiet "$OLD_COMMIT" "$NEW_COMMIT" -- model; then
              echo "::error::Valve updated model/ inside the submodule; failing rather than auto-adopting."
              exit 1
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Keeps the Liquipedia store between runs so fetch-liquipedia only refetches recent days.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: liquipedia-raw-${{ github.run_id }}
          restore-keys: liquipedia-raw-
      - name: Fetch Liquipedia data
        env:
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
        run: npm run fetch-liquipedia
      # Read by the local demo pipeline (`cs2demos auto`), which has no Liquipedia store of its own.
      - name: Export recent LAN series for demos
        continue-on-error: true
        run: npm run export-lan-series
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lan-series
          path: data/lan-series.json
          retention-days: 7
      - name: Build matchdata
        run: npm run build-matchdata -- --date $(date -u +%Y-%m-%d)
      - name: Update data
        env:
          VRS_MATCHDATA: data/matchdata.json
        run: npm run update-data
      - name: Freeze settled months into data/history
        run: npm run freeze-history
      - name: Build Elo
        run: |
          npm run build-elo
          npm run backtest-elo
      - name: Fetch team logos
        continue-on-error: true
        run: npm run fetch-logos
      # A broken event config shouldn't hold back the rest of the nightly data.
      - name: Simulate events and Major invites
        continue-on-error: true
        run: npm run simulate
      - run: npm run test:run
      - uses: actions/upload-artifact@v4
        with:
          name: matchdata
          path: data/matchdata.json
          retention-days: 7
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/logos vendor/counter-strike_regional_standings data/overrides.json data/history
          if ! git diff --cached --quiet; then
            git commit -m "Update data"
            git pull --rebase
            git push
          fi
