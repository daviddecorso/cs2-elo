name: Plan schedules

on:
  workflow_dispatch:
    inputs:
      max:
        description: Most teams to plan (empty for every team on the invite bubble)
        default: ""
      budget:
        description: Minutes to spend planning
        default: "240"
  schedule:
    - cron: "0 13 * * 1" # Mondays, after the 09:23 UTC nightly

permissions:
  contents: write

concurrency: plan-schedules

jobs:
  plan:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, self-runner]
    timeout-minutes: 300
    env:
      # V8 caps the heap at about a quarter of RAM by default (under 1 GB on the 3.5 GB runner VM); the setup needs about 2 GB.
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init vendor/counter-strike_regional_standings vendor/counter-strike_rules_and_regs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Restore only: the nightly owns this cache, and planning makes no Liquipedia requests.
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: liquipedia-raw-
          restore-keys: liquipedia-raw-
          fail-on-cache-miss: true
      - name: Build matchdata
        run: npm run build-matchdata -- --date $(date -u +%Y-%m-%d)
      - name: Plan teams on the invite bubble
        env:
          MAX: ${{ inputs.max }}
          BUDGET: ${{ inputs.budget || '240' }}
        run: npm run plan-batch -- ${MAX:+--max "$MAX"} --budget-minutes "$BUDGET"
      - run: npm run test:run
      - name: Commit plans
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/sim/plan
          if ! git diff --cached --quiet; then
            git commit -m "Update plans"
            git pull --rebase
            git push
          fi
