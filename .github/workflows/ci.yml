name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out submodule with full history
        run: |
          git submodule update --init vendor/counter-strike_regional_standings
          if [ "$(git -C vendor/counter-strike_regional_standings rev-parse --is-shallow-repository)" = "true" ]; then
            git -C vendor/counter-strike_regional_standings fetch --unshallow
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  demos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
